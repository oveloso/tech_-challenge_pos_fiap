      - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createService
      summary: Criar cadastro
      tags:
      - Serviços
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceWrite'
      responses:
        '201':
          description: Cadastro criado ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/services/{serviceId}:
    parameters:
    - $ref: '#/components/parameters/ServiceId'
    get:
      operationId: getService
      summary: Consultar cadastro
      tags:
      - Serviços
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateService
      summary: Editar ou reativar cadastro
      tags:
      - Serviços
      description: 'Atualização parcial; active: true reativa. Campos omitidos são preservados. Campos opcionais
        anuláveis podem ser removidos com null. Mudanças de catálogo não alteram snapshots de orçamentos existentes.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePatch'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deactivateService
      summary: Desativar cadastro
      tags:
      - Serviços
      description: 'Exclusão lógica: mantém histórico, vínculos e unicidade. Não impede leitura de OS existentes;
        o registro não pode ser incluído em novas OS.'
      responses:
        '204':
          description: Cadastro desativado; repetir para recurso já inativo também retorna 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/inventory-items:
    get:
      operationId: listInventoryItems
      summary: Listar cadastros
      tags:
      - Estoque
      description: Resultado com ordenação estável por createdAt e id. O filtro active omitido inclui ambos os estados.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: sku
        in: query
        schema:
          type: string
          maxLength: 64
        description: Busca exata pelo SKU.
      - name: name
        in: query
        schema:
          type: string
          maxLength: 160
        description: Busca por parte do nome.
      - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createInventoryItem
      summary: Criar cadastro
      tags:
      - Estoque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemWrite'
      responses:
        '201':
          description: Cadastro criado ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/inventory-items/{inventoryItemId}:
    parameters:
    - $ref: '#/components/parameters/InventoryItemId'
    get:
      operationId: getInventoryItem
      summary: Consultar cadastro
      tags:
      - Estoque
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateInventoryItem
      summary: Editar ou reativar cadastro
      tags:
      - Estoque
      description: 'Atualização parcial; active: true reativa. Campos omitidos são preservados. Campos opcionais
        anuláveis podem ser removidos com null. Mudanças de catálogo não alteram snapshots de orçamentos existentes.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemPatch'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
