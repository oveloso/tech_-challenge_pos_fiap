openapi: 3.0.3
info:
  title: Oficina — API do Tech Challenge
  version: 0.1.0
  description: 'API da oficina para cadastros, ordens de serviço, orçamentos e estoque. Valores monetários são inteiros int64 em
    centavos de BRL; totais são calculados pelo servidor. UUIDs identificam recursos. Datas seguem RFC 3339 em UTC.
    DELETE de cadastros é lógico: unicidade e histórico são preservados. JWT administrativo e token opaco do cliente
    são credenciais distintas e nunca intercambiáveis. Todas as mutações administrativas de uma OS existente exigem
    expectedVersion; uma versão obsoleta retorna 409 sem efeitos. Não existe alteração livre de status nem reserva
    de estoque na aprovação. Decisões do cliente usam quoteId como controle de versão.'
servers:
- url: /api/v1
  description: Prefixo da API na mesma origem
security:
- AdminBearer: []
tags:
- name: Autenticação
- name: Saúde
- name: Clientes
- name: Veículos
- name: Serviços
- name: Estoque
- name: Ordens de serviço
- name: Área do cliente
- name: Métricas
paths:
  /health:
    get:
      operationId: getHealth
      summary: Consultar saúde da aplicação
      tags:
      - Saúde
      security: []
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco de dados indisponível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: Banco de dados indisponível.
                code: UNAVAILABLE
  /auth/login:
    post:
      operationId: login
      summary: Autenticar funcionário
      tags:
      - Autenticação
      description: Não há cadastro público nem refresh token. Limite de tentativas aplicado por servidor; resposta
        não revela existência do usuário.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/customers:
    get:
      operationId: listCustomers
      summary: Listar cadastros
      tags:
      - Clientes
      description: Resultado com ordenação estável por createdAt e id. O filtro active omitido inclui ambos os estados.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: document
        in: query
        schema:
          type: string
          maxLength: 32
        description: Busca exata pelo documento normalizado; apenas administrativa.
      - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createCustomer
      summary: Criar cadastro
      tags:
      - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
      responses:
        '201':
          description: Cadastro criado ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/customers/{customerId}:
    parameters:
    - $ref: '#/components/parameters/CustomerId'
    get:
      operationId: getCustomer
      summary: Consultar cadastro
      tags:
      - Clientes
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateCustomer
      summary: Editar ou reativar cadastro
      tags:
      - Clientes
      description: 'Atualização parcial; active: true reativa. Campos omitidos são preservados. Campos opcionais
        anuláveis podem ser removidos com null. Mudanças de catálogo não alteram snapshots de orçamentos existentes.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deactivateCustomer
      summary: Desativar cadastro
      tags:
      - Clientes
      description: 'Exclusão lógica: mantém histórico, vínculos e unicidade. Não impede leitura de OS existentes;
        o registro não pode ser incluído em novas OS.'
      responses:
        '204':
          description: Cadastro desativado; repetir para recurso já inativo também retorna 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/vehicles:
    get:
      operationId: listVehicles
