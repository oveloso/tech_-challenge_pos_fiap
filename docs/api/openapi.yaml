      - deliveredAt
      description: Somente a OS vinculada ao token. Sem documento, contato, identificador de cliente, SKU, saldo,
        funcionários ou outros dados administrativos. currentQuote é a última versão publicada, inclusive rejeitada/superada,
        ou null. Não inclui histórico completo de orçamentos. A identificação do veículo corresponde ao snapshot
        da abertura, preservado após alterações cadastrais.
