    delete:
      operationId: deactivateInventoryItem
      summary: Desativar cadastro
      tags:
      - Estoque
      description: 'Exclusão lógica: mantém histórico, vínculos e unicidade. Não impede leitura de OS existentes;
        o registro não pode ser incluído em novas OS.'
      responses:
        '204':
          description: Cadastro desativado; repetir para recurso já inativo também retorna 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/inventory-items/{inventoryItemId}/movements:
    parameters:
    - $ref: '#/components/parameters/InventoryItemId'
    get:
      operationId: listInventoryMovements
      summary: Listar movimentos de estoque
      tags:
      - Estoque
      description: Ordenação por occurredAt e id decrescentes, incluindo abertura, ajustes e baixas de OS.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovementPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createInventoryMovement
      summary: Registrar reposição ou ajuste
      tags:
      - Estoque
      description: Motivo obrigatório. Bloqueia o item na transação e nunca permite saldo negativo; não recebe saldo
        absoluto nem vínculo manual com OS. Movimentos históricos são imutáveis. Item inativo deve ser reativado
        antes de movimentação manual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryMovementCreate'
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovementResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders:
    get:
      operationId: listServiceOrders
      summary: Listar ordens de serviço
      tags:
      - Ordens de serviço
      description: Ordenação por número decrescente. Filtros combinados por AND.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: number
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ServiceOrderStatus'
      - name: customerId
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createServiceOrder
      summary: Abrir ordem de serviço
      tags:
      - Ordens de serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOrderCreate'
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    get:
      operationId: getServiceOrder
      summary: Detalhar ordem de serviço
      tags:
      - Ordens de serviço
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}/items:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    put:
      operationId: replaceServiceOrderItems
      summary: Substituir serviços e peças da OS
      tags:
      - Ordens de serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOrderItemsReplace'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}/diagnosis/start:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: startDiagnosis
      summary: Iniciar diagnóstico
      tags:
      - Ordens de serviço
      description: Somente RECEIVED. Move para IN_DIAGNOSIS. Exige expectedVersion, incrementa a versão uma vez
        e retorna o detalhe atualizado. Validação e efeitos são transacionais; repetição após alteração retorna
        409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}/diagnosis/reopen:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: reopenDiagnosis
      summary: Reabrir diagnóstico
      tags:
      - Ordens de serviço
      description: Somente AWAITING_APPROVAL e antes de iniciar qualquer serviço. Marca orçamento vigente PENDING
        ou APPROVED como SUPERSEDED e volta para IN_DIAGNOSIS. Nova publicação exige nova aprovação. Exige expectedVersion,
        incrementa a versão uma vez e retorna o detalhe atualizado. Validação e efeitos são transacionais; repetição
        após alteração retorna 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}/quotes:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: publishQuote
      summary: Publicar nova versão do orçamento
      tags:
      - Ordens de serviço
      description: Somente IN_DIAGNOSIS, com pelo menos um serviço e preços válidos. Congela nomes, valores e quantidades,
        calcula total, cria orçamento PENDING com versão sequencial e move a OS para AWAITING_APPROVAL. Não recebe
        preços nem total do cliente. Exige expectedVersion, incrementa a versão uma vez e retorna o detalhe atualizado.
        Validação e efeitos são transacionais; repetição após alteração retorna 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}/complete:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: completeServiceOrder
      summary: Finalizar ordem de serviço
      tags:
      - Ordens de serviço
      description: Somente IN_EXECUTION, com todos os serviços COMPLETED. Move para COMPLETED e registra completedAt.
        Não entrega automaticamente. Exige expectedVersion, incrementa a versão uma vez e retorna o detalhe atualizado.
        Validação e efeitos são transacionais; repetição após alteração retorna 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}/deliver:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: deliverServiceOrder
      summary: Entregar veículo
      tags:
      - Ordens de serviço
      description: Somente COMPLETED. Move para DELIVERED e registra deliveredAt. Exige expectedVersion, incrementa
        a versão uma vez e retorna o detalhe atualizado. Validação e efeitos são transacionais; repetição após alteração
        retorna 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}/services/{serviceOrderServiceId}/start:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    - $ref: '#/components/parameters/ServiceOrderServiceId'
    post:
      operationId: startOrderService
      summary: Iniciar serviço da OS
      tags:
      - Ordens de serviço
      description: Exige orçamento vigente APPROVED e serviço NOT_STARTED. No primeiro início, aceita OS AWAITING_APPROVAL,
        verifica e baixa todas as peças aprovadas uma única vez, registra os movimentos, marca o serviço IN_PROGRESS
        e move a OS para IN_EXECUTION. Nos demais inícios, exige IN_EXECUTION e não repete a baixa. Saldo insuficiente
        gera 409 e rollback integral. Vários serviços podem estar em andamento. Repetir início já realizado retorna
        409 sem nova baixa. serviceOrderServiceId é o UUID estável do item de serviço da OS, não o UUID do catálogo.
        Exige expectedVersion e incrementa a versão atomicamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}/services/{serviceOrderServiceId}/complete:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    - $ref: '#/components/parameters/ServiceOrderServiceId'
    post:
      operationId: completeOrderService
      summary: Concluir serviço da OS
      tags:
      - Ordens de serviço
      description: Exige OS IN_EXECUTION e serviço IN_PROGRESS. Marca COMPLETED e completedAt. A conclusão de todos
        os serviços habilita a finalização separada da OS; não altera automaticamente o status dela. serviceOrderServiceId
        é o UUID estável do item de serviço da OS, não o UUID do catálogo. Exige expectedVersion e incrementa a
        versão atomicamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/service-orders/{serviceOrderId}/customer-access:
    parameters:
    - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: issueCustomerAccessToken
      summary: Emitir ou substituir acesso do cliente
      tags:
      - Ordens de serviço
      description: Disponível em qualquer status. Exige expectedVersion e incrementa a versão da OS. Invalida o
        token anterior atomicamente. Token só é retornado nesta emissão; nunca aparece no detalhe ou em logs. expiresAt
        reflete a validade configurada, proposta de 30 dias. Use o token no cabeçalho Authorization Bearer das rotas
        do cliente, nunca na query string. workOrderVersion informa a nova versão da OS para a próxima ação administrativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '201':
          description: Novo token emitido e anterior invalidado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAccessToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /customer/service-order:
    get:
      operationId: getCustomerServiceOrder
      summary: Consultar a OS vinculada ao token
      tags:
      - Área do cliente
      description: A OS é determinada exclusivamente pelo token opaco; não recebe CPF, placa ou identificador de
        cliente. Token inválido, expirado ou substituído retorna 401. A resposta é restrita à projeção pública e
        pode ser consultada novamente para acompanhar as mudanças de estado.
      security:
      - CustomerBearer: []
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerServiceOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /customer/service-order/quote-decision:
    post:
      operationId: decideQuote
      summary: Aprovar ou rejeitar orçamento vigente
      tags:
      - Área do cliente
      description: Somente o orçamento vigente e PENDING aceita a primeira decisão. APPROVED mantém a OS AWAITING_APPROVAL;
        REJECTED devolve a OS a IN_DIAGNOSIS. Repetir a mesma decisão é idempotente apenas enquanto esse orçamento
        continuar vigente e preserva o estado atual sem nova versão/evento, mesmo após início da execução. Decisão
        diferente ou orçamento SUPERSEDED retorna 409. Orçamento de outra OS ou inexistente retorna 404. A primeira
        decisão incrementa a versão administrativa da OS. Não reserva estoque; disponibilidade é verificada no primeiro
        início de serviço.
      security:
      - CustomerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteDecision'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/metrics/service-execution:
    get:
      operationId: getServiceExecutionMetrics
      summary: Consultar tempo de execução por serviço
      tags:
      - Métricas
      description: Agrupa pelo serviço do catálogo. Conta somente execuções COMPLETED com completedAt no intervalo
        [from, to), inclusive de serviços atualmente inativos. Média em segundos de completedAt - startedAt, calculada
        sobre a duração completa de cada execução. Inclui serviços sem amostras com completedCount 0 e meanExecutionSeconds
        null. Ordenação estável por nome e serviceId.
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceExecutionMetricPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/metrics/service-orders:
    get:
      operationId: getServiceOrderMetrics
      summary: Consultar indicadores de ordens de serviço
      tags:
      - Métricas
      description: 'completedCount e meanExecutionSeconds incluem somente OS com completedAt no intervalo [from,
        to), mesmo que já entregues. Duração completa: completedAt - executionStartedAt; diagnóstico e espera por
        aprovação ficam fora. Sem amostras, contagem zero e média null. currentStatusCounts é o retrato atual de
        todas as OS, independente do intervalo, com as seis chaves sempre presentes.'
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderMetrics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de funcionário, validade proposta de uma hora, sem refresh token. Token opaco de cliente
        não é aceito.
    CustomerBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token opaco aleatório de no mínimo 256 bits, vinculado a uma única OS. Só o hash é persistido.
        Validade proposta de 30 dias, configurável. Emissão substitui qualquer token anterior. JWT administrativo
        não é aceito.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Active:
      name: active
      in: query
      description: Filtra por atividade; omitir inclui ativos e inativos.
      schema:
        type: boolean
    From:
      name: from
      in: query
      required: true
      description: Início inclusivo do intervalo em UTC; deve ser anterior a to.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: Fim exclusivo do intervalo em UTC. Intervalo inválido retorna 400.
      schema:
        type: string
        format: date-time
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    InventoryItemId:
      name: inventoryItemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ServiceOrderId:
      name: serviceOrderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ServiceOrderServiceId:
      name: serviceOrderServiceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest:
      description: Entrada inválida, formato/tipo/tamanho incorreto ou erro de validação de campo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Entrada inválida
            status: 400
            detail: Entrada inválida, formato/tipo/tamanho incorreto ou erro de validação de campo.
            code: VALIDATION_ERROR
    Unauthorized:
      description: Credencial ausente, inválida, expirada, substituída ou de tipo incompatível com a rota.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Credencial inválida
            status: 401
            detail: Credencial ausente, inválida, expirada, substituída ou de tipo incompatível com a rota.
            code: UNAUTHORIZED
    NotFound:
      description: Recurso inexistente, ou OS fora do acesso concedido ao cliente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Recurso não encontrado
            status: 404
            detail: Recurso inexistente, ou OS fora do acesso concedido ao cliente.
            code: NOT_FOUND
    Conflict:
      description: Conflito de versão ou estado, unicidade, vínculo incompatível, cadastro inativo, saldo insuficiente
        ou decisão incompatível. Nenhuma alteração parcial é persistida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflito de estado
            status: 409
            detail: Conflito de versão ou estado, unicidade, vínculo incompatível, cadastro inativo, saldo insuficiente
              ou decisão incompatível. Nenhuma alteração parcial é persistida.
            code: VERSION_CONFLICT
    TooManyRequests:
      description: Limite de tentativas excedido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Muitas tentativas
            status: 429
            detail: Limite de tentativas excedido.
            code: RATE_LIMITED
      headers:
        Retry-After:
          description: Segundos até uma nova tentativa.
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: Erro interno sem stack trace, SQL, senha, token ou documento pessoal.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Erro interno
            status: 500
            detail: Erro interno sem stack trace, SQL, senha, token ou documento pessoal.
            code: INTERNAL_ERROR
  schemas:
    Id:
      type: string
      format: uuid
      example: 66b19196-8826-4a60-a22f-3478234adad8
    Money:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Centavos de BRL, sem ponto flutuante. Preços e totais respeitam o limite de inteiro exato do JavaScript;
        o servidor calcula os totais com verificação de overflow e rejeita valores acima deste limite.
      example: 15990
    Timestamp:
      type: string
      format: date-time
      description: Data e hora UTC em RFC 3339.
      example: '2026-10-28T15:00:00Z'
    ExpectedVersion:
      type: integer
      format: int64
      minimum: 1
      description: Última versão da OS recebida pelo consumidor; 409 se obsoleta.
      example: 3
    VersionCommand:
      type: object
      properties:
        expectedVersion:
          $ref: '#/components/schemas/ExpectedVersion'
      required:
      - expectedVersion
      additionalProperties: false
      example:
        expectedVersion: 3
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          example: about:blank
          description: Identificador do tipo do problema.
        title:
          type: string
          example: Conflito de estado
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 409
        detail:
          type: string
          example: A versão da ordem de serviço foi alterada. Consulte novamente antes de tentar.
        code:
          type: string
          example: VERSION_CONFLICT
          description: Código estável da aplicação, por exemplo VALIDATION_ERROR, VERSION_CONFLICT, DUPLICATE_DOCUMENT,
            DUPLICATE_PLATE, DUPLICATE_SKU, INVALID_STATE, INSUFFICIENT_STOCK, QUOTE_SUPERSEDED ou DECISION_CONFLICT.
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: quantity
              message:
                type: string
                example: Deve ser um inteiro positivo.
            required:
            - field
            - message
      required:
      - type
      - title
      - status
      - detail
      - code
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
      required:
      - username
      - password
      additionalProperties: false
      example:
        username: admin-demo
        password: senha-sintetica-de-exemplo
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT administrativo retornado somente em autenticação válida.
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - accessToken
      - tokenType
      - expiresAt
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
    CustomerWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        documentType:
          type: string
          enum:
          - CPF
          - CNPJ
        document:
          type: string
          minLength: 1
          maxLength: 32
          description: CPF ou CNPJ em string. O servidor remove pontuação/espaços e converte letras para maiúsculas
            sem descartá-las. Documento normalizado é único inclusive entre inativos. CPF tem 11 dígitos; CNPJ admite
            formato numérico legado ou alfanumérico vigente, com 12 posições iniciais de letras/dígitos e 2 dígitos
            verificadores numéricos. Validar formato e dígitos verificadores oficiais, sem restringir CNPJ a apenas
            números.
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
        phone:
          type: string
          maxLength: 32
          nullable: true
      required:
      - name
      - documentType
      - document
      additionalProperties: false
    VehicleWrite:
      type: object
      properties:
        customerId:
          $ref: '#/components/schemas/Id'
        plate:
          type: string
          minLength: 1
          maxLength: 16
          description: Normalizada e única inclusive entre veículos inativos; formatos oficiais vigentes serão validados.
        brand:
          type: string
          minLength: 1
          maxLength: 80
        model:
          type: string
          minLength: 1
          maxLength: 120
        year:
          type: integer
          minimum: 1886
          maximum: 9999
      required:
      - customerId
      - plate
      - brand
      - model
      - year
      additionalProperties: false
    ServiceWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
          nullable: true
        priceCents:
          $ref: '#/components/schemas/Money'
      required:
      - name
      - priceCents
      additionalProperties: false
    InventoryItemWrite:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
          description: SKU único inclusive entre itens inativos.
        name:
          type: string
          minLength: 1
          maxLength: 160
        type:
          type: string
          enum:
          - PART
          - SUPPLY
        priceCents:
          $ref: '#/components/schemas/Money'
        initialQuantity:
          type: integer
          format: int64
          minimum: 0
          description: Saldo inicial em unidades inteiras. Se positivo, gera movimento OPENING atomicamente.
          default: 0
      required:
      - sku
      - name
      - type
      - priceCents
      additionalProperties: false
      example:
        sku: PASTILHA-DEMO-001
        name: Pastilha de freio de demonstração
        type: PART
        priceCents: 15990
        initialQuantity: 10
