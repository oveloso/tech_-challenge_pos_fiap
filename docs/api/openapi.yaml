          type: string
          nullable: true
          enum:
          - APPROVED
          - REJECTED
          - null
      required:
      - id
      - version
      - status
      - services
      - parts
      - totalCents
      - publishedAt
      - decidedAt
      - decision
      description: Snapshot imutável de nomes, valores e quantidades. Status e decisão evoluem pelas ações permitidas;
        o histórico é preservado.
    CustomerServiceOrder:
