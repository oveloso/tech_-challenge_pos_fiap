      description: Resultado com ordenação estável por createdAt e id. O filtro active omitido inclui ambos os estados.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: plate
        in: query
        schema:
          type: string
          maxLength: 16
        description: Placa normalizada.
      - name: customerId
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createVehicle
      summary: Criar cadastro
      tags:
      - Veículos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleWrite'
      responses:
        '201':
          description: Cadastro criado ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/vehicles/{vehicleId}:
    parameters:
    - $ref: '#/components/parameters/VehicleId'
    get:
      operationId: getVehicle
      summary: Consultar cadastro
      tags:
      - Veículos
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateVehicle
      summary: Editar ou reativar cadastro
      tags:
      - Veículos
      description: 'Atualização parcial; active: true reativa. Campos omitidos são preservados. Campos opcionais
        anuláveis podem ser removidos com null. Mudanças de catálogo não alteram snapshots de orçamentos existentes.
        A transferência para outro cliente só é permitida se não existir OS ainda não DELIVERED vinculada ao veículo;
        caso contrário, retorna 409. OS preservam customerId e vehicleId originais e snapshots da abertura, mesmo
        após transferência ou alteração de cadastro.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiclePatch'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deactivateVehicle
      summary: Desativar cadastro
      tags:
      - Veículos
      description: 'Exclusão lógica: mantém histórico, vínculos e unicidade. Não impede leitura de OS existentes;
        o registro não pode ser incluído em novas OS.'
      responses:
        '204':
          description: Cadastro desativado; repetir para recurso já inativo também retorna 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
